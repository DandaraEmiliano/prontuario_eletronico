services:
  app:
    build: .
    environment:
      MONGODB_URI: mongodb://mongo:27017/prontuario_demo
      PRONTUARIO_SEED: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7.0
    volumes:
      - prontuario-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prontuario-data:
