<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103b35">
  <title>Pacientes | Prontuário Eletrônico</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Prontuário Eletrônico, início">
      <span class="brand-icon" aria-hidden="true">+</span>
      <span>Prontuário<br>Eletrônico</span>
    </a>
    <nav aria-label="Navegação principal">
      <a class="current" href="#pacientes" aria-current="page">Pacientes</a>
    </nav>
    <p class="demo-label">Ambiente de demonstração<br><small>Use dados fictícios.</small></p>
  </aside>

  <main id="pacientes">
    <header class="page-header">
      <div>
        <h1>Pacientes</h1>
        <p>Consulte e atualize os cadastros de pacientes.</p>
      </div>
      <button class="primary" id="new-patient" type="button" disabled><span aria-hidden="true">+</span> Novo paciente</button>
    </header>

    <section class="summary" aria-label="Total de pacientes">
      <span>Pacientes cadastrados</span>
      <strong id="patient-count">—</strong>
    </section>

    <section class="registry" aria-labelledby="registry-title">
      <div class="registry-header">
        <h2 id="registry-title">Lista de pacientes</h2>
        <input type="search" id="patient-search" aria-label="Buscar por nome" placeholder="Buscar por nome">
      </div>
      <p id="notice" class="notice" role="status" hidden></p>
      <div class="table-wrap">
        <table id="patient-table" hidden>
          <thead><tr><th scope="col">Nome</th><th scope="col">Idade</th><th scope="col">Gênero</th><th scope="col">Ações</th></tr></thead>
          <tbody id="patient-rows"></tbody>
        </table>
      </div>
      <p id="empty-state" class="empty-state" role="status">Carregando pacientes…</p>
    </section>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="patient-form">
      <h2 id="editor-title"></h2>
      <label>Nome<input name="name" required maxlength="120" autocomplete="off"></label>
      <label>Idade<input name="age" type="number" min="0" max="130" step="1" required></label>
      <label>Gênero<input name="gender" list="gender-options" required maxlength="60" autocomplete="off"></label>
      <datalist id="gender-options">
        <option value="Feminino"></option>
        <option value="Masculino"></option>
        <option value="Não binário"></option>
        <option value="Prefiro não informar"></option>
      </datalist>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" data-close>Cancelar</button>
        <button class="primary" type="submit">Salvar paciente</button>
      </div>
    </form>
  </dialog>

  <dialog id="removal" aria-labelledby="removal-title">
    <form id="removal-form">
      <h2 id="removal-title">Excluir paciente</h2>
      <p>O cadastro de <strong id="removal-name"></strong> será excluído.</p>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" data-close autofocus>Cancelar</button>
        <button class="danger" type="submit">Excluir paciente</button>
      </div>
    </form>
  </dialog>
</body>
</html>
